# HTTP для bolahnov.ru (фронт + acme)
server {
    listen 80;
    server_name bolahnov.ru www.bolahnov.ru;

    root /app/www;
    index index.html index.htm;

    # Let’s Encrypt (front)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS для bolahnov.ru (фронт)
server {
    listen 443 ssl;
    server_name bolahnov.ru www.bolahnov.ru;

    ssl_certificate     /etc/letsencrypt/live/bolahnov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bolahnov.ru/privkey.pem;

    root /app/www;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTP для api.bolahnov.ru (acme + редирект на https)
server {
    listen 80;
    server_name api.bolahnov.ru;

    # Let’s Encrypt (api)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.bolahnov.ru$request_uri;
    }
}

# HTTPS для api.bolahnov.ru (прокси на backend)
server {
    listen 443 ssl;
    server_name api.bolahnov.ru;

    ssl_certificate     /etc/letsencrypt/live/api.bolahnov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bolahnov.ru/privkey.pem;

    location / {
        proxy_pass http://app_backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}